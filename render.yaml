services:
  - type: web
    name: financial
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATA_DIR
        value: /data
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
    disk:
      name: finance-data
      mountPath: /data
      sizeGB: 1
